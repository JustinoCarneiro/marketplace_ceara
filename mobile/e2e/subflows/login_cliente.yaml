appId: com.onda.marketplace
---
# Mesmo diálogo de sistema do teclado AOSP documentado em detalhe em
# 01_cadastro_cliente.yaml (timing não-determinístico, intercepta a digitação
# enquanto aberto) — dispensa tolerante antes e depois de cada inputText.
- tapOn: "Já tenho conta"
- tapOn:
    text: "seu@email.com"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${EMAIL_CLIENTE}
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "••••••••"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${SENHA}
- tapOn:
    text: "DENY"
    optional: true
# NÃO usar hideKeyboard aqui: tela de login é curta (e-mail + senha + Entrar,
# sem campos extras tipo BIO/CPF), "Entrar" não fica coberto pelo teclado.
# hideKeyboard chegou a ser adicionado por padrão, mas causou regressão real
# — se o teclado já tiver fechado no momento (efeito colateral de dispensar o
# diálogo AOSP), o fallback de hideKeyboard manda um BACK de sistema, que
# volta a navegação pra Splash em vez de fechar teclado nenhum. Visto direto
# no screenshot: app voltou pra tela inicial, "Entrar" nunca mais encontrado.
- tapOn: "Entrar"
- assertVisible:
    text: "Olá"
    optional: true
