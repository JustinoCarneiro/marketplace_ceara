appId: com.onda.marketplace
env:
  NOME: "Jose Prestador"
  CPF: "123.456.789-00"
  EMAIL: "jose.prestador@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sou Prestador"
    timeout: 10000
- tapOn: "Sou Prestador"
- assertVisible: "Criar conta"
# Mesmo diálogo de sistema do teclado AOSP documentado em detalhe em
# 01_cadastro_cliente.yaml — timing genuinamente não-determinístico (confirmado
# aparecendo em pontos diferentes a cada run, inclusive antes de digitar).
# Dispensa tolerante ANTES e DEPOIS de cada inputText.
- tapOn:
    text: "José Wagner Ferreira"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${NOME}
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "123.456.789-00"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${CPF}
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "jose@email.com"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${EMAIL}
- tapOn:
    text: "DENY"
    optional: true
# Achado por evidência direta em 01_cadastro_cliente.yaml (screenshot mostrando
# a senha digitada dentro do campo E-MAIL) — hideKeyboard força o layout a
# assentar antes de tocar no campo de senha, evitando a corrida entre a troca
# de teclado (email-address → padrão) e o cálculo do tap.
- hideKeyboard
- tapOn:
    id: "input-senha"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${SENHA}
- tapOn:
    text: "DENY"
    optional: true
# handleSubmit em RegisterProviderScreen.tsx recusa silenciosamente (só seta
# error, nunca chama a API) sem aceptedTerms — faltava esse tapOn, nunca tinha
# sido pego porque o pipeline não chegava vivo até aqui (backend não subia).
- tapOn:
    id: "checkbox-termos"
- tapOn: "Elétrica"
- tapOn: "Cadastrar"
- assertVisible: "EM VERIFICAÇÃO"
