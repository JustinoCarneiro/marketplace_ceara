appId: com.onda.marketplace
env:
  NOME: "Jose Prestador"
  CPF: "123.456.789-00"
  EMAIL: "jose.prestador@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sou Prestador"
    timeout: 10000
- tapOn: "Sou Prestador"
- assertVisible: "Criar conta"
- tapOn:
    text: "José Wagner Ferreira"
- inputText: ${NOME}
- tapOn:
    text: "123.456.789-00"
- inputText: ${CPF}
- tapOn:
    text: "jose@email.com"
- inputText: ${EMAIL}
- tapOn:
    text: "mínimo 8 caracteres"
- inputText: ${SENHA}
# Mesmo diálogo de sistema do teclado AOSP (permissão de contatos) documentado
# em 01_cadastro_cliente.yaml — dispensa tolerante antes de continuar.
- tapOn:
    text: "DENY"
    optional: true
# handleSubmit em RegisterProviderScreen.tsx recusa silenciosamente (só seta
# error, nunca chama a API) sem aceptedTerms — faltava esse tapOn, nunca tinha
# sido pego porque o pipeline não chegava vivo até aqui (backend não subia).
- tapOn:
    id: "checkbox-termos"
- tapOn: "Elétrica"
- tapOn: "Cadastrar"
- assertVisible: "EM VERIFICAÇÃO"
