appId: com.onda.marketplace
env:
  EMAIL_CLIENTE: "lucia.teste@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: false
- runFlow: subflows/login_cliente.yaml
# Botão real na Home é "Criar pedido" (HomeScreen.tsx) — "Novo pedido" só existe como
# título da tela seguinte (NewRequestScreen.tsx:164), nunca como botão na Home. Nunca
# validado ao vivo antes (pipeline não chegava aqui).
- tapOn: "Criar pedido"
- assertVisible: "Novo pedido"
- tapOn: "Elétrica"
# NewRequestScreen tem bastante conteúdo (anexos, localização, chips de bairro) — mesmo
# padrão de 1º render lento já visto em RegisterProviderScreen (03_cadastro_prestador.yaml).
# tapOn direto no placeholder chegou a "Element not found" com o campo claramente
# renderizado no screenshot de debug — timing, não seletor errado.
- extendedWaitUntil:
    visible: "DESCRIÇÃO"
    timeout: 15000
- tapOn:
    text: "A tomada da cozinha"
- inputText: "Tomada da sala parou de funcionar."
- tapOn: "Continuar"
- assertVisible: "Pedido criado!"
- assertVisible: "PENDENTE"
