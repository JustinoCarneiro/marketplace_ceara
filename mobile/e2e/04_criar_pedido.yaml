appId: com.onda.marketplace
env:
  EMAIL_CLIENTE: "lucia.teste@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: false
- runFlow: subflows/login_cliente.yaml
# Botão real na Home é "Criar pedido" (HomeScreen.tsx) — "Novo pedido" só existe como
# título da tela seguinte (NewRequestScreen.tsx:164), nunca como botão na Home. Nunca
# validado ao vivo antes (pipeline não chegava aqui).
- tapOn: "Criar pedido"
- assertVisible: "Novo pedido"
- tapOn: "Elétrica"
# "DESCRIÇÃO" (label) aparece instantâneo — não era render lento. A árvore de
# acessibilidade no momento da falha mostra o campo certinho (hintText com o texto
# completo, clickable, bounds válidos) mas o tapOn por texto nunca encontrava durante
# os ~18s de busca — suspeita: TextInput com multiline (NewRequestScreen.tsx:207) não
# casa de forma confiável por conteúdo de hint via tapOn de texto no Maestro, mesmo
# quando a dump final da hierarquia mostra o atributo presente. testID em vez de texto,
# mesmo padrão já usado pra senha/checkbox neste projeto.
- extendedWaitUntil:
    visible: "DESCRIÇÃO"
    timeout: 15000
- tapOn:
    id: "input-descricao"
- inputText: "Tomada da sala parou de funcionar."
# Teclado aberto (com a barra de sugestão de contatos, mesma feature do diálogo AOSP)
# cobre "Continuar" — confirmado por screenshot. Mesmo padrão condicional já usado em
# login_cliente.yaml: tenta direto primeiro, só chama hideKeyboard se ainda
# comprovadamente na mesma tela (evita o risco de BACK indevido já visto lá).
- tapOn:
    text: "Continuar"
    optional: true
- runFlow:
    when:
      visible: "Novo pedido"
    commands:
      - hideKeyboard
      - tapOn: "Continuar"
- assertVisible: "Pedido criado!"
- assertVisible: "PENDENTE"
