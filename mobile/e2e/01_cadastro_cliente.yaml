appId: com.onda.marketplace
env:
  NOME: "Lucia Teste"
  EMAIL: "lucia.teste@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sou Cliente"
    timeout: 10000
- tapOn: "Sou Cliente"
- assertVisible: "Criar conta"
- tapOn:
    text: "Lúcia Maria Alves"
- inputText: ${NOME}
# O teclado AOSP do emulador de CI pede permissão de contatos ("Allow Android
# Keyboard (AOSP) to access your contacts?") em algum ponto não-determinístico
# do preenchimento — confirmado em runs diferentes aparecendo logo após NOME
# numa, e só depois de SENHA na outra. É um diálogo de SISTEMA, fora da árvore
# do app, que intercepta a digitação seguinte enquanto aberto (não é só
# sobreposição visual). Por isso a dispensa tolerante vai depois de CADA campo,
# não só uma vez — não dá pra prever quando ele aparece.
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "lucia.alves@email.com"
- inputText: ${EMAIL}
- tapOn:
    text: "DENY"
    optional: true
# 6 runs seguidas confirmaram (inclusive pela árvore nativa: "focused": "false",
# sem texto) que o campo não ganha foco de verdade na 1ª tentativa logo depois
# da transição de teclado do campo E-MAIL — Maestro reporta "COMPLETED" tanto
# no tap quanto no inputText, mas nada gruda. 2º tap no mesmo elemento é o
# workaround padrão pra esse tipo de corrida de foco em automação mobile.
- tapOn:
    id: "input-senha"
- tapOn:
    id: "input-senha"
- inputText: ${SENHA}
- tapOn:
    text: "DENY"
    optional: true
# Botão "Criar conta" fica desabilitado até aceitar os termos (canSubmit exige
# acceptedTerms) — sem esse tapOn, o botão nunca é encontrado pelo Maestro.
# tapOn por texto falhou ("Li e aceito os" not found) — os links "Termos de Uso"/
# "Política de Privacidade" aninhados com onPress fragmentam a árvore de
# acessibilidade nativa. testID é o padrão já usado em todo o resto do app.
- tapOn:
    id: "checkbox-termos"
- tapOn: "Criar conta"
- assertVisible: "Elétrica"
- waitForAnimationToEnd
