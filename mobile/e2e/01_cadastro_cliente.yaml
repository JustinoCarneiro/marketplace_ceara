appId: com.onda.marketplace
env:
  NOME: "Lucia Teste"
  EMAIL: "lucia.teste@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sou Cliente"
    timeout: 10000
- tapOn: "Sou Cliente"
- assertVisible: "Criar conta"
# O teclado AOSP do emulador de CI pede permissão de contatos ("Allow Android
# Keyboard (AOSP) to access your contacts?") em timing genuinamente
# não-determinístico — confirmado por 8 runs aparecendo em pontos diferentes
# a cada vez: depois do NOME, depois do E-MAIL, depois de focar SENHA (antes
# até de digitar). É diálogo de SISTEMA, fora da árvore do app: enquanto
# aberto, ele intercepta a digitação seguinte por completo (Maestro reporta
# "COMPLETED" mesmo digitando no vazio — não é erro, é silêncio). Por isso a
# dispensa tolerante vai ANTES e DEPOIS de cada inputText, nos 3 campos —
# cobre o diálogo aparecendo tanto no foco quanto durante/depois da digitação.
- tapOn:
    text: "Lúcia Maria Alves"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${NOME}
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "lucia.alves@email.com"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${EMAIL}
- tapOn:
    text: "DENY"
    optional: true
# Achado por evidência direta (screenshot da run 8): o texto da senha foi
# parar DENTRO do campo E-MAIL ("...onda.devsenha1234") — o tap em
# input-senha não estava tirando o foco de verdade do campo anterior.
# Corrida entre o layout ainda se ajustando à troca de teclado
# (email-address → padrão) e o tap calculado com bounds da hierarquia
# anterior. hideKeyboard força o layout a assentar antes de localizar e
# tocar no campo seguinte.
- hideKeyboard
- tapOn:
    id: "input-senha"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${SENHA}
- tapOn:
    text: "DENY"
    optional: true
# Botão "Criar conta" fica desabilitado até aceitar os termos (canSubmit exige
# acceptedTerms) — sem esse tapOn, o botão nunca é encontrado pelo Maestro.
# tapOn por texto falhou ("Li e aceito os" not found) — os links "Termos de Uso"/
# "Política de Privacidade" aninhados com onPress fragmentam a árvore de
# acessibilidade nativa. testID é o padrão já usado em todo o resto do app.
- tapOn:
    id: "checkbox-termos"
- tapOn: "Criar conta"
- assertVisible: "Elétrica"
- waitForAnimationToEnd
