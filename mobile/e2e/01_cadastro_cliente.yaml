appId: com.onda.marketplace
env:
  NOME: "Lucia Teste"
  EMAIL: "lucia.teste@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sou Cliente"
    timeout: 10000
- tapOn: "Sou Cliente"
- assertVisible: "Criar conta"
- tapOn:
    text: "Lúcia Maria Alves"
- inputText: ${NOME}
# O teclado AOSP do emulador de CI pede permissão de contatos assim que o
# campo NOME dispara autocomplete, e o diálogo de sistema (fora da árvore do
# app) intercepta a digitação seguinte — não só cobre visualmente, ENGOLE os
# toques/texto dos campos seguintes enquanto está aberto (1ª tentativa dispensava
# só antes do checkbox-termos, tarde demais: SENHA já tinha sido "digitada" no
# vazio). Dispensar aqui, logo após o campo que dispara, antes de tocar em
# qualquer outro campo. Confirmado via screenshot de debug do Maestro.
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    text: "lucia.alves@email.com"
- inputText: ${EMAIL}
- tapOn:
    text: "mínimo 8 caracteres"
- inputText: ${SENHA}
# Defesa extra caso o diálogo apareça de novo/atrasado — tolerante, não quebra
# se não houver nada pra dispensar.
- tapOn:
    text: "DENY"
    optional: true

# Botão "Criar conta" fica desabilitado até aceitar os termos (canSubmit exige
# acceptedTerms) — sem esse tapOn, o botão nunca é encontrado pelo Maestro.
# tapOn por texto falhou ("Li e aceito os" not found) — os links "Termos de Uso"/
# "Política de Privacidade" aninhados com onPress fragmentam a árvore de
# acessibilidade nativa. testID é o padrão já usado em todo o resto do app.
- tapOn:
    id: "checkbox-termos"
- tapOn: "Criar conta"
- assertVisible: "Elétrica"
- waitForAnimationToEnd
