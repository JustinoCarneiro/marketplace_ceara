appId: com.onda.marketplace
env:
  EMAIL_CLIENTE: "lucia.teste@onda.dev"
  SENHA: "senha1234"
  CPF_CLIENTE: "111.444.777-35"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Já tenho conta"
    timeout: 10000
- runFlow: subflows/login_cliente.yaml
- tapOn: "Pedidos"
- tapOn:
    id: "meu-pedido-card"
    index: 0
- assertVisible: "PROPOSTO"
# Entrada para as propostas no RequestDetail (novo)
- tapOn:
    id: "btn-ver-propostas"
- assertVisible: "Aceitar proposta"
- tapOn:
    id: "btn-aceitar-proposta"
    index: 0
# PaymentChoice → o botão de pagar dispara o modal de CPF (1º pagamento)
- tapOn:
    id: "btn-pagar"
- assertVisible: "Confirme sua identidade"
- tapOn:
    id: "input-cpf"
- tapOn:
    text: "DENY"
    optional: true
- inputText: ${CPF_CLIENTE}
- tapOn:
    text: "DENY"
    optional: true
- tapOn:
    id: "btn-confirmar-cpf"
- runFlow:
    # O teclado numérico pode cobrir a ação. Só o fecha se o modal ainda
    # estiver aberto depois da primeira tentativa, evitando BACK indevido.
    when:
      visible: "Confirme sua identidade"
    commands:
      - hideKeyboard
      - tapOn:
          id: "btn-confirmar-cpf"
# Após confirmar o CPF, segue para o Pix simulado
- extendedWaitUntil:
    visible: "Paguei"
    timeout: 10000
- tapOn:
    id: "btn-paguei"
# O gateway simulado confirma assincronamente; a tela faz polling por até 21s.
- extendedWaitUntil:
    visible: "Pagamento retido com segurança"
    timeout: 30000
- assertVisible: "PEDIDO ACEITO"
