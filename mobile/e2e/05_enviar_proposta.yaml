appId: com.onda.marketplace
env:
  EMAIL_PRESTADOR: "jose.prestador@onda.dev"
  SENHA: "senha1234"
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Já tenho conta"
    timeout: 10000
- runFlow: subflows/login_prestador.yaml
- assertVisible: "Pedidos disponíveis"
# O card do pedido já traz o botão "Enviar proposta" (abre a folha de proposta)
- tapOn:
    id: "btn-propor"
    index: 0
- assertVisible: "SEU VALOR"
- tapOn:
    id: "input-valor"
- inputText: "150"
# prazo já vem preenchido com "2" por padrão
- tapOn:
    id: "btn-enviar-proposta"
# Ao enviar, a folha fecha (goBack) e volta para a lista
- assertVisible: "Pedidos disponíveis"
