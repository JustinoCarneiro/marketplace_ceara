name: Mobile — Maestro E2E

# Roda manualmente ou em push que toque código relevante.
# Emite minutos de Actions pesados (emulador ~30 min) — paths filtra o ruído.
on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'mobile/src/**'
      - 'mobile/e2e/**'
      - 'backend/src/**'
      - '.github/workflows/mobile-e2e.yml'

jobs:
  maestro-android:
    name: Android API 29 — Maestro E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ─── Banco PostGIS (mesmo que produção) ───────────────────────────────────
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass_ci
          POSTGRES_DB: onda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # KVM acelera o emulador Android em ~10x (disponível no ubuntu-latest)
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ─── Runtimes ─────────────────────────────────────────────────────────
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ─── Dependências mobile ──────────────────────────────────────────────
      - name: npm ci (mobile)
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      # Gera android/ a partir de app.json (pasta é gitignored no projeto)
      - name: expo prebuild → android/
        run: npx expo prebuild --platform android --no-install
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080/api/v1

      # Cache do Gradle wrapper + caches (~1,5 GB salvo após 1ª execução)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      # ─── Backend ──────────────────────────────────────────────────────────
      - name: Build backend JAR (skip tests)
        run: mvn -f backend/pom.xml -q package -DskipTests
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Iniciar backend em background
        run: |
          # Sem -Xmx, o heap default (~25% da RAM do runner) fica competindo com o
          # build do Gradle rodando em seguida — 512m sobra pro backend de teste.
          java -Xmx512m -jar backend/target/marketplace-*.jar &
          echo "Aguardando :8080..."
          timeout 90 bash -c 'until nc -z localhost 8080; do sleep 2; done'
          echo "Backend UP"
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/onda_db
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass_ci
          POSTGRES_DB: onda_db
          # Segredos obrigatórios — configure em Settings → Secrets → Actions
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CPF_ENCRYPTION_KEY: ${{ secrets.CPF_ENCRYPTION_KEY }}
          MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.MARKETPLACE_WEBHOOK_SECRET }}

      # ─── APK release (standalone) ─────────────────────────────────────────
      # IMPORTANTE: assembleDebug gera o Expo dev client (precisa de Metro) e no
      # CI mostra só a tela "Development Build" → o app nunca carrega. O release
      # embute o bundle JS e roda sozinho. O Expo prebuild assina o release com
      # a keystore de debug por padrão, então não precisa de keystore próprio.
      # 10.0.2.2 é o IP padrão do emulador Android para o host → não precisa adb reverse
      #
      # 2026-08-04: job estourava o timeout de 1h travado em "e: [ksp]
      # java.lang.OutOfMemoryError: Metaspace" — o android/gradle.properties que o
      # `expo prebuild` gera (gitignored, não editável no repo) compila as 4 ABIs
      # (armeabi-v7a/arm64-v8a/x86/x86_64) com teto de só 512m de Metaspace.
      # GRADLE_OPTS abaixo NÃO ajuda nisso — configura a JVM cliente do Gradle, não
      # a JVM de build (que lê org.gradle.jvmargs do arquivo, mesmo com --no-daemon).
      # Restringir pra ABI única do emulador (arch: x86_64 acima) resolveu o timeout,
      # mas passou a falhar rápido com "GC thrashing" mesmo com heap de 3g — um
      # diagnóstico (`free -h`) confirmou que o runner tem 15GB livres nesse ponto,
      # então não é falta de RAM do host: o teto de heap que eu tinha posto era
      # pequeno demais pra fase de configuração do Gradle (~15 módulos nativos do
      # Expo), mesmo sobrando memória física. Heap subido de verdade abaixo.
      - name: Build APK release (standalone)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=2048m" >> android/gradle.properties
          cd android && ./gradlew assembleRelease --no-daemon -q -PreactNativeArchitectures=x86_64
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8080/api/v1
          GRADLE_OPTS: "-Xmx3g"

      # ─── Maestro CLI ──────────────────────────────────────────────────────
      - name: Instalar Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      # ─── Emulador + testes ────────────────────────────────────────────────
      # Ordem dos testes importa — estado de BD persiste entre eles:
      #   01 → registra Lucia (cliente)
      #   03 → registra Jose (prestador) — clearState limpa sessão de Lucia
      #   04 → login Lucia (Splash visível após 03), cria pedido
      #   05 → login Jose, envia proposta
      #   06 → known-fail PROVISÓRIO: fluxo de aceite agora é alcançável de
      #        "Meus pedidos" via o botão "Ver propostas recebidas" no
      #        RequestDetail (novo) → CompareProposals → aceitar → pagar (modal
      #        de CPF). Mantido known-fail só até o 1º run validar de ponta a
      #        ponta; depois promover a required.
      #   07 → known-fail: depende de 06 + falta um fluxo "prestador inicia
      #        serviço" (ACEITO → EM_ANDAMENTO) — o app tem o botão "Iniciar
      #        serviço", falta o passo Maestro do lado do prestador.
      #   02 → standalone: verifica fluxo de login isolado
      - name: E2E no emulador Android 29
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_3a
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -memory 3072
          disable-animations: true
          # A action executa o script linha a linha via `sh -c`, o que quebra
          # funções/loops multi-linha. Toda a lógica fica em run-maestro.sh,
          # chamado como um único comando (bash roda o arquivo inteiro).
          script: bash mobile/e2e/run-maestro.sh

      # ─── Artefatos ────────────────────────────────────────────────────────
      - name: Publicar relatórios Maestro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports-${{ github.run_number }}
          path: ~/.maestro/tests/
          if-no-files-found: ignore
