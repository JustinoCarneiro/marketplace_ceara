name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — Java 21 + Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar testes (sem banco — slices @WebMvcTest + H2)
        run: mvn -f backend/pom.xml test --no-transfer-progress

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  mobile-typecheck:
    name: Mobile — TypeScript check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: mobile

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: mobile

  admin-build:
    name: Admin — Build Vite + TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: admin

      - name: Build (tsc + vite)
        run: npm run build
        working-directory: admin

  backend-e2e:
    name: Backend — E2E (Testcontainers + PostGIS)
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar testes E2E (Testcontainers)
        run: mvn -f backend/pom.xml test -Dtest="E2EFluxoPrincipalTest" --no-transfer-progress
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'false'

      - name: Publicar relatório E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-e2e
          path: backend/target/surefire-reports/

  admin-playwright:
    name: Admin — Playwright E2E
    runs-on: ubuntu-latest
    needs: admin-build

    # Banco real (PostGIS) para o backend usado pelos testes do painel.
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass
          POSTGRES_DB: onda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onda_user -d onda_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend (jar)
        run: mvn -f backend/pom.xml package -DskipTests --no-transfer-progress

      # Sobe o backend em background com o profile "seed" (cria admin@onda.com
      # e maria@teste.com exigidos pelos testes). Segredos são de teste apenas.
      - name: Subir backend (profile seed)
        run: |
          JAR=$(ls backend/target/marketplace-*.jar | grep -v original | head -1)
          java -jar "$JAR" > backend.log 2>&1 &
          echo "Backend iniciado (PID $!)"
        env:
          SPRING_PROFILES_ACTIVE: seed
          DATABASE_URL: jdbc:postgresql://localhost:5432/onda_db
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass
          JWT_SECRET: test-secret-key-for-e2e-tests-min-32-chars
          CPF_ENCRYPTION_KEY: test-cpf-aes256-key-32-chars-here!
          MARKETPLACE_WEBHOOK_SECRET: test-webhook-secret

      - name: Aguardar health do backend
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend UP"; exit 0
            fi
            sleep 3
          done
          echo "::error::Backend não subiu a tempo"; tail -n 100 backend.log; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: admin

      - name: Instalar browsers Playwright
        run: npx playwright install --with-deps chromium
        working-directory: admin

      - name: Rodar testes Playwright
        run: npx playwright test
        working-directory: admin
        env:
          CI: 'true'

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: admin/playwright-report/

      - name: Publicar log do backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-playwright
          path: backend.log

  mobile-playwright:
    name: Mobile — Playwright E2E (preview web)
    runs-on: ubuntu-latest
    needs: mobile-typecheck

    # Banco real (PostGIS) para o backend usado pelos testes do fluxo mobile.
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass
          POSTGRES_DB: onda_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onda_user -d onda_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend (jar)
        run: mvn -f backend/pom.xml package -DskipTests --no-transfer-progress

      # profile "seed" é inofensivo aqui (os testes de fluxo criam seus próprios
      # cliente/prestador via cadastro na UI, com e-mail/CPF derivados do timestamp)
      # — mantido só por consistência com o job admin-playwright.
      - name: Subir backend (profile seed)
        run: |
          JAR=$(ls backend/target/marketplace-*.jar | grep -v original | head -1)
          java -jar "$JAR" > backend.log 2>&1 &
          echo "Backend iniciado (PID $!)"
        env:
          SPRING_PROFILES_ACTIVE: seed
          DATABASE_URL: jdbc:postgresql://localhost:5432/onda_db
          POSTGRES_USER: onda_user
          POSTGRES_PASSWORD: onda_pass
          JWT_SECRET: test-secret-key-for-e2e-tests-min-32-chars
          CPF_ENCRYPTION_KEY: test-cpf-aes256-key-32-chars-here!
          MARKETPLACE_WEBHOOK_SECRET: test-webhook-secret

      - name: Aguardar health do backend
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend UP"; exit 0
            fi
            sleep 3
          done
          echo "::error::Backend não subiu a tempo"; tail -n 100 backend.log; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: mobile

      - name: Instalar browsers Playwright
        run: npx playwright install --with-deps chromium
        working-directory: mobile

      # playwright.config.ts sobe `npm run web` (Expo/react-native-web) sozinho via
      # webServer — sem emulador Android, é o mesmo preview validado em /run-mobile-web.
      - name: Rodar testes Playwright
        run: npx playwright test
        working-directory: mobile
        env:
          CI: 'true'
          EXPO_PUBLIC_API_URL: http://localhost:8080/api/v1

      - name: Publicar relatório Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-report
          path: mobile/playwright-report/

      - name: Publicar log do backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-mobile-playwright
          path: backend.log
