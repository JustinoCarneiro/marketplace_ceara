# ── Ambiente de demonstração pública (VPS compartilhada, Coolify) ───────────
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Este é um ambiente de DEMO pra apresentação a investidores — SPRING_PROFILES_ACTIVE=seed
# (dados semeados) e gateway de pagamento simulado (não há integração real com nenhum
# gateway ainda). Não é lançamento com dinheiro real. Ver ROADMAP.md Fase 5.
#
# Segredos (JWT_SECRET, CPF_ENCRYPTION_KEY, MARKETPLACE_WEBHOOK_SECRET, POSTGRES_PASSWORD,
# ADMIN_PASS) NUNCA vão num arquivo commitado — ver .env.prod.example pro que precisa
# existir, e configure os valores reais direto nas env vars do Coolify.
#
# Portas host (VPS 157.173.212.76 — 8093/8094/8095 confirmados livres em 2026-08-13):
#   8093 → backend
#   8094 → admin
#   8095 → mobile-web

services:
  db:
    image: postgis/postgis:15-3.4
    container_name: onda_prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-onda_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onda_user} -d ${POSTGRES_DB:-onda_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: onda_backend:prod
    container_name: onda_prod_backend
    ports:
      - "8093:8080"
    environment:
      SPRING_PROFILES_ACTIVE: seed
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-onda_db}
      POSTGRES_USER: ${POSTGRES_USER:-onda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY}
      MARKETPLACE_WEBHOOK_SECRET: ${MARKETPLACE_WEBHOOK_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS}
      ALLOW_MISSING_ALERT_CHANNEL: "true"
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-admin@onda.dev}
      CORS_ALLOWED_ORIGINS: https://onda-admin.157.173.212.76.sslip.io,https://onda-app.157.173.212.76.sslip.io
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://onda-api.157.173.212.76.sslip.io/api/v1
    image: onda_admin:prod
    container_name: onda_prod_admin
    ports:
      - "8094:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

  mobile-web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://onda-api.157.173.212.76.sslip.io/api/v1
    image: onda_mobile_web:prod
    container_name: onda_prod_mobile_web
    ports:
      - "8095:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 64m

volumes:
  postgres_prod_data:
