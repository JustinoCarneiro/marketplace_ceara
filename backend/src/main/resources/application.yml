spring:
  application:
    name: marketplace

  # Virtual Threads — Java 21 (TS01)
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/onda_db}
    username: ${POSTGRES_USER:onda_user}
    password: ${POSTGRES_PASSWORD:onda_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    user:
      name: ${ADMIN_USER:admin}
      password: ${ADMIN_PASS:changeme}

  # Upload de mídia do pedido (US04) — default do Boot (1MB) é pequeno demais pra
  # foto de câmera; áudio curto (m4a) fica bem abaixo disso.
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

  # M12: E-mail (alertas SOS/Disputa/Verificação)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  secret: ${JWT_SECRET}                          # obrigatório em produção (min 32 chars)
  access-token-expiration-ms: 900000             # 15 minutos
  refresh-token-days: 30

cpf:
  encryption-key: ${CPF_ENCRYPTION_KEY}          # obrigatório em produção (min 32 chars, AES-256)

# M12: destinatário dos alertas operacionais
notification:
  admin-email: ${ADMIN_ALERT_EMAIL:admin@marketplace-ceara.com.br}
  # SOS (US21/US30) precisa avisar fora do painel. Sem MAIL_USERNAME/MAIL_PASSWORD não há
  # canal externo, e a aplicação se recusa a subir — assim a ausência nunca passa
  # despercebida em produção. Dev/demo/CI declaram a exceção (ver application-seed.yml).
  allow-missing-alert-channel: ${ALLOW_MISSING_ALERT_CHANNEL:false}

cors:
  # 3000 = admin build · 5173 = admin dev (Vite) · 8081 = preview web do Expo (mobile)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}

marketplace:
  webhook:
    secret: ${MARKETPLACE_WEBHOOK_SECRET}          # obrigatório em produção — segredo compartilhado com gateway
  comissao: ${MARKETPLACE_COMISSAO:0.15}           # percentual padrão (15%)
  outbox:
    delay-ms: ${MARKETPLACE_OUTBOX_DELAY_MS:5000}  # intervalo do OutboxProcessor em ms
  gateway:
    # Confirma cobranças automaticamente, emulando o webhook do gateway real.
    # SEMPRE false em produção — lá quem confirma é o gateway de verdade.
    # Ativado no profile "seed" (dev/demo/CI), ver application-seed.yml.
    simulate-confirmation: ${MARKETPLACE_GATEWAY_SIMULATE:false}
  review:
    # Double-blind: avaliação só fica pública quando ambas as partes avaliam, ou
    # quando vence este prazo de reciprocidade (padrão Airbnb = 14 dias).
    reveal-deadline-days: ${MARKETPLACE_REVIEW_REVEAL_DAYS:14}
    reveal-job-delay-ms: ${MARKETPLACE_REVIEW_REVEAL_JOB_MS:3600000}  # varredura de vencidas (1h)
  pontualidade:
    # Tolerância pra considerar "no prazo" o início real (iniciadoEm) vs. o horário proposto
    # na proposta aceita (horarioProposto) — chegar adiantado nunca conta como atraso.
    tolerancia-minutos: ${MARKETPLACE_PONTUALIDADE_TOLERANCIA_MIN:30}

# Actuator — observabilidade base (TS08)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false   # SMTP opcional — desabilitado se sem credenciais

# Logs estruturados (TS08)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.onda.marketplace: DEBUG
    org.flywaydb: INFO
