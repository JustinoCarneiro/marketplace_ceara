# Profile ativo nos testes @SpringBootTest com Testcontainers.
# O datasource é substituído em runtime pelo container — as props abaixo
# são overrides para que o contexto Spring suba sem variáveis de produção.

spring:
  # Sobrepõe o H2 do application.yml base de teste: o E2E usa Postgres real
  # (Testcontainers injeta url/username/password via @DynamicPropertySource).
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate       # Flyway cuida do schema
    # Igual à produção (application.yml principal): sem isto o E2E rodava com open-in-view LIGADO — uma sessão do Hibernate
    # compartilhada pela requisição inteira, em que uma entidade carregada numa transação (ex.: o REQUIRES_NEW da senha) volta
    # com o estado antigo na seguinte e a trava de linha não relê nada. Teste com configuração diferente da produção mente.
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: test-secret-key-for-e2e-tests-min-32-chars
  access-token-expiration-ms: 900000
  refresh-token-days: 30

cpf:
  encryption-key: test-cpf-aes256-key-32-chars-here!

marketplace:
  webhook:
    secret: test-webhook-secret
  comissao: 0.15
  outbox:
    delay-ms: 500

notification:
  admin-email: admin@test.local
  # Sem SMTP aqui (ver abaixo): declara a ausência de canal para o contexto subir.
  allow-missing-alert-channel: true

# Desabilita mail real nos testes E2E
spring.mail.host: ""
spring.mail.username: ""
spring.mail.password: ""
management.health.mail.enabled: false
