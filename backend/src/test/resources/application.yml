# Configuração de teste — sobrepõe o application.yml principal
spring:
  threads:
    virtual:
      enabled: true   # deve ser testado — mesma config de produção

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false   # Flyway desabilitado nos slices de teste (@WebMvcTest)
  security:
    user:
      name: test
      password: test

jwt:
  secret: "test-secret-key-must-be-at-least-32-chars!!"
  access-token-expiration-ms: 900000
  refresh-token-days: 30

cpf:
  encryption-key: "01234567890123456789012345678901"

marketplace:
  webhook:
    secret: "test-webhook-secret-for-tests-only"
  # O H2 daqui não cria as tabelas com coluna geográfica (providers_profile): o backfill do hash do CPF dos prestadores,
  # que consulta essa tabela na subida, não roda no contexto de teste. Ele é provado no E2E (Postgres real).
  cpf-backfill:
    enabled: false

notification:
  # Testes não têm SMTP; a ausência de canal é declarada para o contexto subir.
  allow-missing-alert-channel: true
